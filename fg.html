<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="apple-touch-icon" href="/fg-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="공포탐욕지수">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" id="themeColor" content="#f4e4d0">
    <meta name="robots" content="noindex">
    <title>공포탐욕지수</title>
    <link rel="manifest" href="/fg-manifest.json">
    <link rel="icon" href="/fg-icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* fear-greed.html에서 시장·환율·게이지 부분만 떼어낸 모바일 앱용 페이지.
           스타일·로직은 원본에서 복사했으므로 원본을 고치면 여기도 같이 볼 것. */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* 라이트 = 가을 노을 카페 — 오트라테 바탕, 에스프레소 글자, 노을빛 상단 */
        :root {
            --bg: #f4e4d0; --bg-card: #fbf3e8; --bg-hover: #f1e0cb;
            --border: #e0c6a8; --border-2: #ecd9c2;
            --text: #3a2618; --text-muted: #5e4130; --text-dim: #6f4f3a; --text-dimmer: #7d5c45;
            --glow: radial-gradient(120% 60% at 50% 0%, #f6b98a 0%, #f3cfa6 35%, rgba(244,228,208,0) 75%);
            --up: #4f7a32; --down: #b2392b;
        }
        body.dark {
            --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1c2128;
            --border: #30363d; --border-2: #21262d;
            --text: #e6edf3; --text-muted: #adbac7; --text-dim: #9da7b3; --text-dimmer: #8b949e;
            --glow: none;
            --up: #56d364; --down: #f85149;
        }

        body {
            background: var(--glow) no-repeat, var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
            word-break: keep-all;
            min-height: 100svh;
        }

        .container {
            max-width: 940px;
            margin: 0 auto;
            /* 설치된 앱은 상태바·제스처 바 아래까지 그려지므로 안전영역만큼 띄운다 */
            padding: calc(1.25rem + env(safe-area-inset-top)) 1rem calc(1.5rem + env(safe-area-inset-bottom));
        }

        /* ── Theme Toggle ── */
        /* ── App Header ── */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            max-width: 520px;
            margin: 0 auto 0.5rem;
        }
        .app-title {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .app-header > div:first-child { min-width: 0; }
        .app-date {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 0.15rem;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        body.gauge-only .app-header { display: none; }

        .header-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .install-btn {
            display: inline-flex; align-items: center; gap: 0.3rem;
            height: 32px; padding: 0 0.8rem;
            border: none; border-radius: 999px;
            background: var(--text); color: var(--bg);
            font: inherit; font-size: 0.78rem; font-weight: 700;
            cursor: pointer;
        }
        .install-btn[hidden] { display: none; }
        .install-btn svg { width: 14px; height: 14px; }
        .install-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

        .theme-toggle {
            flex-shrink: 0;
            width: 36px; height: 36px;
            display: grid; place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
        }
        .theme-toggle:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
        .theme-toggle svg { width: 18px; height: 18px; }
        body.dark .icon-sun, body:not(.dark) .icon-moon { display: none; }

        /* ── Strips (Market / FX) ── */
        .strip {
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.2rem;
            background: var(--bg-card);
        }
        .strip-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.9rem;
        }
        .strip-title {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }
        .strip-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.68rem;
            color: var(--text-dimmer);
        }
        .live-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #28a745;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }
        .live-dot.loading { background: #ef6c00; animation: none; }
        .live-dot.error   { background: #d32f2f; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(0.8); }
        }

        .chips {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
        }
        #fxGrid { grid-template-columns: repeat(2, 1fr); }
        .chip {
            border: 1px solid var(--border-2);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            background: var(--bg);
            min-width: 0;
        }
        .chip-name {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text-dimmer);
            margin-bottom: 0.2rem;
        }
        .chip-value {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chip-change { font-size: 0.68rem; font-weight: 600; white-space: nowrap; }
        /* 값과 등락을 한 줄에 — 폭이 모자라면 등락만 아랫줄로 내려간다 */
        .chip-body {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            column-gap: 0.4rem;
        }
        .up   { color: var(--up); }
        .down { color: var(--down); }
        .chip.skeleton {
            height: 66px;
            background: linear-gradient(90deg, var(--border-2) 25%, var(--bg-hover) 50%, var(--border-2) 75%);
            background-size: 200% 100%;
            animation: skeleton 1.2s ease-in-out infinite;
        }
        @keyframes skeleton {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Gauge + History ── */
        /* 화면의 주인공은 게이지 하나 — 과거 기록은 일부러 작고 조용하게 둔다 */
        .main-content {
            max-width: 520px;
            margin: 0 auto 1.75rem;
        }
        .gauge-section { display: flex; flex-direction: column; align-items: center; }
        .gauge-canvas { width: 100%; height: auto; display: block; }
        .zone-now {
            margin-top: -0.2rem;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }
        .last-updated {
            margin-top: 0.35rem;
            font-size: 0.78rem;
            color: var(--text-dimmer);
        }
        /* 캐시에서 나온 값이라는 표시 — 오래된 값을 주는 건 괜찮지만 말은 해야 한다 */
        .stale-badge {
            display: inline-flex; align-items: center; gap: 0.35rem;
            margin-top: 0.4rem; padding: 0.15rem 0.5rem;
            border: 1px solid rgba(217,119,6,0.4); border-radius: 999px;
            font-size: 0.7rem; font-weight: 700; color: #b45309;
        }
        .stale-badge[hidden] { display: none; }
        body.dark .stale-badge { color: #fbbf24; border-color: rgba(251,191,36,0.35); }

        .history {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-2);
        }
        .history-item { text-align: center; padding: 0 0.25rem; }
        .history-item + .history-item { border-left: 1px solid var(--border-2); }
        .history-period { font-size: 0.8rem; color: var(--text-dim); }
        .history-score {
            margin: 0.2rem 0 0.1rem;
            font-size: 1.35rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .history-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }

        .error-msg {
            display: none;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #d32f2f;
        }
        .error-msg.visible { display: block; }

        /* ── Gauge-only mode (?gauge) — 위젯 앱의 웹뷰나 게이지 전용 바로가기용 ── */
        body.gauge-only .strip,
        body.gauge-only .history { display: none; }
        body.gauge-only .container {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 680px) {
            .chips { grid-template-columns: repeat(2, 1fr); }
        }
        /* 폰에서는 스크롤 없이 한 화면에 다 들어오게 — 게이지는 그대로 두고 아래 칸들만 조인다 */
        @media (max-width: 480px) {
            .container { padding: calc(0.75rem + env(safe-area-inset-top)) 0.85rem calc(0.75rem + env(safe-area-inset-bottom)); }
            .app-header { margin-bottom: 0; }
            .app-title { font-size: 1.05rem; }
            .app-date { font-size: 0.7rem; margin-top: 0.05rem; }
            .theme-toggle { width: 32px; height: 32px; }
            .gauge-canvas { max-width: 320px; }
            .zone-now { font-size: 1.2rem; margin-top: -0.35rem; }
            .last-updated { font-size: 0.72rem; margin-top: 0.15rem; }
            .main-content { margin-bottom: 1.1rem; }
            .history { margin-top: 0.85rem; padding-top: 0.75rem; }
            .history-period, .history-label { font-size: 0.72rem; }
            .history-score { font-size: 1.15rem; margin: 0.05rem 0; }

            .strip { padding: 0.75rem 0.75rem; margin-bottom: 0.85rem; }
            .strip-header { margin-bottom: 0.6rem; }
            .chips { gap: 0.5rem; }
            .chip { padding: 0.5rem 0.6rem; }
            .chip-name { font-size: 0.62rem; margin-bottom: 0.05rem; }
            .chip-value { font-size: 0.92rem; margin-bottom: 0; }
            .chip-change { font-size: 0.66rem; }
            .chip.skeleton { height: 42px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div>
                <h1 class="app-title">공포탐욕지수</h1>
                <p class="app-date" id="appDate">CNN 미국 증시 투자 심리</p>
            </div>
            <div class="header-actions">
                <button class="install-btn" id="installBtn" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
                    앱 설치
                </button>
                <button class="theme-toggle" id="themeToggle" aria-label="라이트/다크 모드 전환">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
            </div>
        </header>

        <!-- Gauge + History -->
        <div class="main-content">
            <div class="gauge-section">
                <canvas id="gaugeCanvas" class="gauge-canvas" width="500" height="350" role="img" aria-label="공포탐욕지수 게이지"></canvas>
                <div class="zone-now" id="zoneNow"></div>
                <div class="last-updated" id="lastUpdated"></div>
                <span class="stale-badge" id="staleBadge" hidden></span>
            </div>
            <div class="history" id="history"></div>
        </div>
        <!-- Exchange Rate Strip -->
        <div class="strip">
            <div class="strip-header">
                <span class="strip-title">실시간 환율</span>
                <div class="strip-status">
                    <span class="live-dot loading" id="fxDot"></span>
                    <span id="fxStatusText">불러오는 중...</span>
                </div>
            </div>
            <div class="chips" id="fxGrid">
                <div class="chip skeleton"></div><div class="chip skeleton"></div>
            </div>
        </div>

        <!-- Market Ticker Strip -->
        <div class="strip">
            <div class="strip-header">
                <span class="strip-title">글로벌 시장</span>
                <div class="strip-status">
                    <span class="live-dot loading" id="mktDot"></span>
                    <span id="mktStatusText">불러오는 중...</span>
                </div>
            </div>
            <div class="chips" id="mktChips">
                <div class="chip skeleton"></div><div class="chip skeleton"></div>
                <div class="chip skeleton"></div><div class="chip skeleton"></div>
            </div>
        </div>

        <div class="error-msg" id="errorMsg">데이터를 불러오지 못했습니다. 예시 값을 표시합니다.</div>
    </div>

    <script>
        // ══════════════════════════════════════
        //  CONFIG
        // ══════════════════════════════════════
        // 상류 URL 전체를 반드시 encodeURIComponent로 감싸서 붙일 것.
        // 인코딩하지 않으면 URL 안의 &가 프록시의 별도 쿼리 파라미터로 파싱되어 Yahoo에는 잘린 URL만 전달됨.
        const CORS_PROXY = '/api/proxy?url=';
        const API_URL = 'https://production.dataviz.cnn.io/index/fearandgreed/graphdata';
        // 앱을 다시 열었을 때(visibilitychange) 이보다 오래됐으면 새로 받는다
        const REFRESH_MS = 10 * 60 * 1000;

        const ZONES = [
            { max: 25,  label: '극도의 공포', color: '#d32f2f' },
            { max: 45,  label: '공포',        color: '#ef6c00' },
            { max: 55,  label: '중립',        color: '#757575' },
            { max: 75,  label: '탐욕',        color: '#558b2f' },
            { max: 100, label: '극도의 탐욕', color: '#2e7d32' },
        ];
        function getZone(score) {
            return ZONES.find(z => score <= z.max) || ZONES[ZONES.length - 1];
        }

        // 기본은 라이트(노을 카페 톤) — 시스템 다크 설정은 따르지 않고, 토글로 고른 값만 기억한다
        const isDark = () => localStorage.getItem('fg-app-theme') === 'dark';
        const tc = (light, dark) => isDark() ? dark : light;
        function applyTheme() {
            document.body.classList.toggle('dark', isDark());
            document.getElementById('themeColor').content = tc('#f4d4b4', '#0d1117');
            if (lastScore !== null) drawGauge(lastScore);
        }

        // ══════════════════════════════════════
        //  GAUGE
        // ══════════════════════════════════════
        const gaugeCanvas = document.getElementById('gaugeCanvas');
        const gCtx = gaugeCanvas.getContext('2d');
        const GW = 500, GH = 350;
        const GCX = GW / 2, GCY = 245;
        const OUTER_R = 188, INNER_R = 118;
        const LIFT = 8;         // 현재 구간이 바깥으로 튀어나오는 정도
        const ZONE_GAP = 0.6;   // 구간 사이 틈 (점수 단위)
        // Inter엔 한글 글리프가 없어 캔버스가 아무 폰트로나 대체한다 → 한글 폰트를 명시
        const GAUGE_FONT = "Inter, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif";
        let lastScore = null;
        let prevScore = null;   // 전일 종가 — 게이지 바깥 표식용

        const scoreToAngle = (score) => Math.PI + (score / 100) * Math.PI;

        function drawGauge(score) {
            const dpr = window.devicePixelRatio || 1;
            if (gaugeCanvas.width !== GW * dpr) {
                gaugeCanvas.width = GW * dpr;
                gaugeCanvas.height = GH * dpr;
                gCtx.scale(dpr, dpr);
            }
            gCtx.clearRect(0, 0, GW, GH);

            const zoneAngles = [
                { start: 0,  end: 25,  color: '#e57373', labelColor: '#b71c1c', label: '극도의\n공포' },
                { start: 25, end: 45,  color: '#ffb74d', labelColor: '#e65100', label: '공포' },
                { start: 45, end: 55,  color: '#e0e0e0', labelColor: '#616161', label: '중립' },
                { start: 55, end: 75,  color: '#aed581', labelColor: '#33691e', label: '탐욕' },
                { start: 75, end: 100, color: '#81c784', labelColor: '#1b5e20', label: '극도의\n탐욕' },
            ];
            const at = (r, v) => [GCX + Math.cos(scoreToAngle(v)) * r, GCY + Math.sin(scoreToAngle(v)) * r];
            const muted = tc('#c9a98a', '#3d444d');

            // 현재 구간만 원색 + 바깥으로 LIFT만큼 들어 올린다 — 바늘을 찾기 전에 색으로 먼저 읽히게
            const activeIdx = ZONES.indexOf(getZone(score));
            zoneAngles.forEach((zone, i) => {
                const active = i === activeIdx;
                const s = zone.start + (zone.start > 0 ? ZONE_GAP : 0);
                const e = zone.end - (zone.end < 100 ? ZONE_GAP : 0);
                gCtx.save();
                gCtx.globalAlpha = active ? 1 : 0.3;
                if (active) {
                    gCtx.shadowColor = zone.color;
                    gCtx.shadowBlur = 18;
                }
                gCtx.beginPath();
                gCtx.arc(GCX, GCY, OUTER_R + (active ? LIFT : 0), scoreToAngle(s), scoreToAngle(e));
                gCtx.arc(GCX, GCY, INNER_R, scoreToAngle(e), scoreToAngle(s), true);
                gCtx.closePath();
                gCtx.fillStyle = zone.color;
                gCtx.fill();
                gCtx.restore();
            });

            gCtx.textAlign = 'center';
            gCtx.textBaseline = 'middle';
            const labelR = (OUTER_R + INNER_R) / 2;
            zoneAngles.forEach((zone, i) => {
                // 띠를 따라 눕히면 양끝("극도의 공포")이 세로로 서서 폰에서 읽기 어렵다 → 항상 가로로 쓴다.
                // 흐린 건 띠만 — 글자는 투명도 없이 진하게 둬야 작은 화면에서도 읽힌다
                const active = i === activeIdx;
                const [x, y] = at(labelR + (active ? LIFT / 2 : 0), (zone.start + zone.end) / 2);
                gCtx.fillStyle = active ? '#2b1a10' : tc('#6f4f3a', '#adbac7');
                gCtx.font = `${active ? 800 : 700} 17px ${GAUGE_FONT}`;
                zone.label.split('\n').forEach((line, j, arr) => {
                    gCtx.fillText(line, x, y + (j - (arr.length - 1) / 2) * 19);
                });
            });
            gCtx.globalAlpha = 1;

            // 안쪽 잔눈금 (5점 간격, 25점마다 길게)
            gCtx.strokeStyle = muted;
            for (let v = 0; v <= 100; v += 5) {
                const major = v % 25 === 0;
                gCtx.lineWidth = major ? 2 : 1;
                gCtx.beginPath();
                gCtx.moveTo(...at(INNER_R - 8, v));
                gCtx.lineTo(...at(INNER_R - (major ? 20 : 13), v));
                gCtx.stroke();
            }

            gCtx.fillStyle = tc('#6f4f3a', '#adbac7');
            gCtx.font = `600 16px ${GAUGE_FONT}`;
            [0, 25, 50, 75, 100].forEach(v => {
                gCtx.fillText(String(v), ...at(OUTER_R + LIFT + 20, v));
            });

            // 전일 종가 표식 — 오늘 바늘과 나란히 보면 하루 사이 얼마나 움직였는지 바로 읽힌다
            if (prevScore !== null) {
                const a = scoreToAngle(prevScore);
                gCtx.save();
                gCtx.translate(...at(OUTER_R + LIFT + 3, prevScore));
                gCtx.rotate(a + Math.PI / 2);
                gCtx.beginPath();
                gCtx.moveTo(0, 0);
                gCtx.lineTo(-6, -9);
                gCtx.lineTo(6, -9);
                gCtx.closePath();
                gCtx.fillStyle = tc('#6f4f3a', '#c9d1d9');
                gCtx.fill();
                gCtx.restore();
                // 큰 눈금 숫자와 겹치는 자리면 글자는 생략하고 표식만 남긴다
                if ([0, 25, 50, 75, 100].every(v => Math.abs(v - prevScore) > 5)) {
                    gCtx.fillStyle = tc('#3a2618', '#e6edf3');
                    gCtx.font = `700 15px ${GAUGE_FONT}`;
                    gCtx.fillText('전일', ...at(OUTER_R + LIFT + 21, prevScore));
                }
            }

            // 바늘 — 뒤로 짧은 꼬리를 둬서 회전축이 보이게
            const needleColor = tc('#3a2618', '#e6edf3');
            gCtx.save();
            gCtx.translate(GCX, GCY);
            gCtx.rotate(scoreToAngle(score));
            gCtx.shadowColor = tc('rgba(58,38,24,0.25)', 'rgba(0,0,0,0.5)');
            gCtx.shadowBlur = 6;
            gCtx.shadowOffsetY = 2;
            gCtx.beginPath();
            gCtx.moveTo(-18, -3);
            // 끝은 안쪽 눈금까지만 — 띠 안으로 들어가면 현재 구간 라벨을 가린다
            gCtx.lineTo(INNER_R - 10, -1);
            gCtx.lineTo(INNER_R - 10, 1);
            gCtx.lineTo(-18, 3);
            gCtx.closePath();
            gCtx.fillStyle = needleColor;
            gCtx.fill();
            gCtx.shadowColor = 'transparent';
            gCtx.beginPath();
            gCtx.arc(0, 0, 9, 0, Math.PI * 2);
            gCtx.fill();
            gCtx.beginPath();
            gCtx.arc(0, 0, 3.5, 0, Math.PI * 2);
            gCtx.fillStyle = getZone(score).color;
            gCtx.fill();
            gCtx.restore();

            gCtx.textAlign = 'center';
            gCtx.textBaseline = 'middle';
            gCtx.font = `900 76px ${GAUGE_FONT}`;
            gCtx.fillStyle = getZone(score).color;
            gCtx.fillText(Math.round(score).toString(), GCX, GCY + 64);
        }

        function animateGauge(target, duration = 1200) {
            const start = performance.now();
            function step(now) {
                const p = Math.min((now - start) / duration, 1);
                drawGauge((1 - Math.pow(1 - p, 3)) * target);
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        // ══════════════════════════════════════
        //  FEAR & GREED DATA
        // ══════════════════════════════════════
        function renderHistory(items) {
            document.getElementById('history').innerHTML = items.map(item => {
                const zone = getZone(item.score);
                return `
                    <div class="history-item">
                        <div class="history-period">${item.period}</div>
                        <div class="history-score" style="color:${zone.color}">${Math.round(item.score)}</div>
                        <div class="history-label">${zone.label}</div>
                    </div>`;
            }).join('');
        }

        function formatUpdateTime(ts) {
            const d = new Date(ts);
            const p = (n) => String(n).padStart(2, '0');
            return `마지막 업데이트: ${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${d.getHours()}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        // 서비스 워커가 오프라인에서 캐시로 응답하면 X-From-Cache를 달아 준다(sw.js dataFirst).
        // 헤더 이름을 바꾸면 sw.js·index.html·fear-greed.html도 같이 고칠 것.
        function showStale(response) {
            const el = document.getElementById('staleBadge');
            if (response.headers.get('X-From-Cache') !== '1') { el.hidden = true; return; }
            const served = Date.parse(response.headers.get('date') || '');
            let txt = '캐시된 값 · 오프라인';
            if (served) {
                const mins = Math.max(1, Math.round((Date.now() - served) / 60000));
                const hours = Math.round(mins / 60);
                txt = mins < 60 ? `${mins}분 전 값 · 오프라인`
                    : hours < 24 ? `${hours}시간 전 값 · 오프라인`
                    : `${Math.round(hours / 24)}일 전 값 · 오프라인`;
            }
            el.textContent = txt;
            el.hidden = false;
        }

        async function fetchData() {
            if (lastScore === null) drawGauge(50);
            const errorMsg = document.getElementById('errorMsg');
            try {
                // fear-greed.html과 같은 URL을 써야 프록시·SW 캐시를 같이 탄다
                const since = new Date();
                since.setFullYear(since.getFullYear() - 1);
                const res = await fetch(CORS_PROXY + encodeURIComponent(`${API_URL}/${since.toISOString().split('T')[0]}`));
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                showStale(res);
                const fg = (await res.json()).fear_and_greed;
                if (fg?.score == null) throw new Error('no score');

                const cur = fg.score;
                lastScore = cur;
                prevScore = fg.previous_close ?? null;
                errorMsg.classList.remove('visible');
                animateGauge(cur);
                const zone = getZone(cur);
                const zoneNow = document.getElementById('zoneNow');
                zoneNow.textContent = zone.label;
                zoneNow.style.color = zone.color;
                gaugeCanvas.setAttribute('aria-label', `공포탐욕지수 ${Math.round(cur)}, ${zone.label}`);
                renderHistory([
                    { period: '전일', score: fg.previous_close ?? cur },
                    { period: '1주 전',  score: fg.previous_1_week ?? cur },
                    { period: '1개월 전',  score: fg.previous_1_month ?? cur },
                    { period: '1년 전',    score: fg.previous_1_year ?? cur },
                ]);
                document.getElementById('lastUpdated').textContent = formatUpdateTime(fg.timestamp ?? Date.now());
            } catch (e) {
                console.warn('CNN API failed:', e.message);
                if (lastScore === null) errorMsg.classList.add('visible');
            }
        }

        // ══════════════════════════════════════
        //  MARKET TICKER
        // ══════════════════════════════════════
        const MKT_SYMBOLS = [
            { sym: '^KS11',   name: 'KOSPI',   fmt: (v) => v.toLocaleString('ko-KR', { maximumFractionDigits: 2 }) },
            { sym: '^IXIC',   name: 'NASDAQ',  fmt: (v) => v.toLocaleString('en-US', { maximumFractionDigits: 2 }) },
            { sym: '^GSPC',   name: 'S&P 500', fmt: (v) => v.toLocaleString('en-US', { maximumFractionDigits: 2 }) },
            { sym: 'BTC-USD', name: 'BTC',     fmt: (v) => '$' + v.toLocaleString('en-US', { maximumFractionDigits: 0 }) },
        ];

        function setStatus(prefix, state, text) { // state: 'loading' | 'live' | 'error'
            document.getElementById(prefix + 'Dot').className = 'live-dot' + (state !== 'live' ? ' ' + state : '');
            document.getElementById(prefix + 'StatusText').textContent = text;
        }

        // chgPct가 null이면 비교 기준(전일 값)이 없다는 뜻 — 0%로 보이면 오해하므로 대시로 표시
        function chipHtml(name, value, chgPct, extra = '') {
            const up = chgPct >= 0;
            const change = chgPct === null
                ? '<div class="chip-change" style="color:var(--text-dimmer)">— —</div>'
                : `<div class="chip-change ${up ? 'up' : 'down'}">${up ? '▲ +' : '▼ '}${chgPct.toFixed(2)}%${extra}</div>`;
            return `
                <div class="chip">
                    <div class="chip-name">${name}</div>
                    <div class="chip-body">
                        <div class="chip-value">${value}</div>
                        ${change}
                    </div>
                </div>`;
        }

        async function fetchOneMktSymbol(sym) {
            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=5d&interval=1d`;
            const res = await fetch(CORS_PROXY + encodeURIComponent(yahooUrl));
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const meta = (await res.json())?.chart?.result?.[0]?.meta;
            if (!meta) throw new Error('No meta');
            return { price: meta.regularMarketPrice ?? meta.previousClose, prevClose: meta.previousClose ?? meta.chartPreviousClose };
        }

        async function fetchMarketTicker() {
            setStatus('mkt', 'loading', '불러오는 중...');
            const settled = await Promise.allSettled(MKT_SYMBOLS.map(m => fetchOneMktSymbol(m.sym)));
            if (settled.every(r => r.status === 'rejected')) { setStatus('mkt', 'error', '불러오기 실패'); return; }
            document.getElementById('mktChips').innerHTML = MKT_SYMBOLS.map((m, i) => {
                const r = settled[i];
                if (r.status !== 'fulfilled' || r.value.price == null) return chipHtml(m.name, 'N/A', null);
                const { price, prevClose } = r.value;
                const prev = prevClose || price;
                return chipHtml(m.name, m.fmt(price), ((price - prev) / prev) * 100);
            }).join('');
            setStatus('mkt', 'live', '방금 갱신됨');
        }

        // ══════════════════════════════════════
        //  EXCHANGE RATES
        // ══════════════════════════════════════
        // 화면엔 달러·엔만 보여주지만 values는 4개(USD·JPY·CNY·EUR) 그대로 계산해 저장한다 —
        // fear-greed.html이 같은 fg-fx-cache를 읽고 4개 전부를 기대하기 때문
        const FX_PAIRS = ['🇺🇸 USD / KRW', '🇯🇵 100 JPY / KRW'];

        // fear-greed.html과 같은 fg-fx-cache 키를 공유한다 — 전일 대비 계산에 어제 값이 필요해서.
        // 형태 {date, values, prevDate, prevValues}를 바꾸면 두 페이지가 서로의 캐시를 깨뜨린다.
        function getFxCache() { try { return JSON.parse(localStorage.getItem('fg-fx-cache') || 'null'); } catch { return null; } }

        async function fetchExchangeRates() {
            setStatus('fx', 'loading', '불러오는 중...');
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                if (json.result !== 'success') throw new Error('API error');
                const r = json.rates;
                const values = [r.KRW, (r.KRW / r.JPY) * 100, r.KRW / r.CNY, r.KRW / r.EUR];

                const today = new Date().toISOString().slice(0, 10);
                const cache = getFxCache();
                const prevValues = !cache ? null : cache.date !== today ? cache.values : cache.prevValues;
                localStorage.setItem('fg-fx-cache', JSON.stringify({
                    date: today, values, prevDate: cache ? cache.date : null, prevValues,
                }));

                const fmt = (v) => v.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                document.getElementById('fxGrid').innerHTML = FX_PAIRS.map((label, i) => {
                    const prev = prevValues ? prevValues[i] : null;
                    if (!prev) return chipHtml(label, fmt(values[i]), null);
                    const abs = values[i] - prev;
                    return chipHtml(label, fmt(values[i]), (abs / prev) * 100, ` (${abs >= 0 ? '+' : ''}${abs.toFixed(2)})`);
                }).join('');
                setStatus('fx', 'live', '방금 갱신됨');
            } catch (e) {
                console.warn('FX fetch failed:', e.message);
                setStatus('fx', 'error', '불러오기 실패');
            }
        }

        // ══════════════════════════════════════
        //  INIT
        // ══════════════════════════════════════
        let lastFetch = 0;
        function refreshAll() {
            lastFetch = Date.now();
            fetchData();
            if (gaugeOnly) return;
            fetchMarketTicker();
            fetchExchangeRates();
        }

        document.getElementById('appDate').textContent =
            new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }) + ' · CNN 미국 증시 투자 심리';
        const gaugeOnly = new URLSearchParams(location.search).has('gauge');
        document.body.classList.toggle('gauge-only', gaugeOnly);
        applyTheme();
        document.getElementById('themeToggle').addEventListener('click', () => {
            localStorage.setItem('fg-app-theme', isDark() ? 'light' : 'dark');
            applyTheme();
        });
        refreshAll();
        // 설치형 앱은 백그라운드에 오래 머물다 다시 열리므로, 돌아왔을 때 오래된 값이면 새로 받는다
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && Date.now() - lastFetch > REFRESH_MS) refreshAll();
        });

        // Chrome은 자동 설치 배너를 한 번 닫거나 앱을 지우면 한동안 다시 띄우지 않는다.
        // beforeinstallprompt는 그와 별개로 "설치 가능" 상태면 오므로, 이걸 잡아 직접 버튼으로 노출한다.
        // 이미 설치됐거나 iOS(이벤트 미지원)면 이벤트가 안 와서 버튼은 숨은 채로 남는다.
        let installPrompt = null;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            installPrompt = e;
            installBtn.hidden = gaugeOnly;
        });
        installBtn.addEventListener('click', async () => {
            if (!installPrompt) return;
            installPrompt.prompt();
            await installPrompt.userChoice;
            installPrompt = null;   // prompt()는 한 번만 쓸 수 있다
            installBtn.hidden = true;
        });
        window.addEventListener('appinstalled', () => { installBtn.hidden = true; });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
